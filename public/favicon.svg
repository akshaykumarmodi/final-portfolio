<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1d1138" />
      <stop offset="45%" stop-color="#0e0822" />
      <stop offset="85%" stop-color="#070412" />
      <stop offset="100%" stop-color="#04020a" />
    </radialGradient>
    
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f5f3ff" />
      <stop offset="80%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#c084fc" flood-opacity="0.75" />
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#9333ea" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGlow)" stroke="url(#rimGrad)" stroke-width="8" />
  <circle cx="256" cy="230" r="160" fill="#a855f7" opacity="0.15" />

  <g filter="url(#textGlow)">
    <text x="234" y="322" 
          font-family="'Fraunces', 'Cinzel', -apple-system, BlinkMacSystemFont, 'Segoe UI', serif" 
          font-size="198" 
          font-weight="800" 
          letter-spacing="-7" 
          text-anchor="middle" 
          fill="url(#textGrad)">AKM</text>
  </g>

  <g transform="translate(388, 138) scale(2.8)" filter="url(#starGlow)">
    <path fill="#e9d5ff" d="M12 0c.6 6.4 2.2 9.6 5.1 10.9 1.4.6 3.6 1 6.9 1.1-3.3.1-5.5.5-6.9 1.1C14.2 14.4 12.6 17.6 12 24c-.6-6.4-2.2-9.6-5.1-10.9C5.5 12.5 3.3 12.1 0 12c3.3-.1 5.5-.5 6.9-1.1C9.8 9.6 11.4 6.4 12 0Z" />
